<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begin — Submission Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="start">

  <section id="start-screen">
    <div class="start-card">
      <div class="start-banner">Loading&hellip; Please Wait</div>
      <div class="start-body">
        <div class="start-spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <h1 class="start-title">Submission Portal</h1>
        <p class="start-copy">You will be asked to submit an assignment.<br>Please submit it <strong>before the deadline.</strong></p>
        <button id="start-btn">Begin</button>
        <p class="start-note">Duration: about 40 seconds.</p>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
